services:
  - type: web
    name: sino-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:demo
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: mock
      - key: APP_URL
        value: https://sino-demo-xe1r.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sino-demo-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true

databases:
  - name: sino-demo-db
    databaseName: sino_demo
    user: sino_user
    plan: free
    region: frankfurt

